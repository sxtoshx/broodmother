<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>broodmother</title>
<meta property="og:title" content="broodmother">
<meta property="og:image" content="https://broodmother.ru/avatar.png">
<meta name="theme-color" content="#120a24">
<link rel="icon" href="avatar.png">
<style>
:root{
  --bg:#120a24; --bg2:#2a0f4a; --violet:#9b4dff; --pink:#ff4fb8; --glow:#d68bff; --text:#fbefff;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:radial-gradient(ellipse at 50% 35%,var(--bg2) 0%,var(--bg) 70%);
  color:var(--text);
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
main{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center}
.portrait{
  width:min(300px,68vw);aspect-ratio:1;border-radius:28px;position:relative;
  transform-style:preserve-3d;transition:transform .15s ease-out;
  animation:float 6s ease-in-out infinite;
}
.portrait::before{
  content:"";position:absolute;inset:-3px;border-radius:30px;z-index:-1;
  background:linear-gradient(135deg,var(--pink),var(--violet),var(--pink));
  filter:blur(18px);opacity:.75;animation:pulse 3s ease-in-out infinite;
}
.portrait img{
  width:100%;height:100%;object-fit:cover;border-radius:28px;display:block;
  border:2px solid rgba(255,160,230,.55);
}
@keyframes float{50%{translate:0 -10px}}
@keyframes pulse{50%{opacity:.35;filter:blur(26px)}}
h1{
  font-size:clamp(2.2rem,8vw,3.6rem);font-weight:700;letter-spacing:.04em;
  background:linear-gradient(90deg,var(--glow),var(--pink),var(--violet),var(--pink),var(--glow));
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 7s linear infinite;
  filter:drop-shadow(0 0 14px rgba(255,79,184,.45));
}
@keyframes shine{to{background-position:300% 0}}
.btn{
  position:relative;display:inline-flex;align-items:center;gap:12px;
  padding:16px 34px;border-radius:999px;color:#fff;text-decoration:none;font-size:1.1rem;font-weight:600;
  background:linear-gradient(135deg,var(--violet),var(--pink));
  box-shadow:0 0 24px rgba(255,79,184,.5),inset 0 0 0 1px rgba(255,255,255,.25);
  transition:transform .2s,box-shadow .2s;overflow:hidden;
}
.btn::after{
  content:"";position:absolute;top:0;left:-70%;width:50%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);
  transform:skewX(-20deg);transition:left .6s;
}
.btn:hover,.btn:focus-visible{transform:translateY(-3px) scale(1.04);box-shadow:0 0 40px rgba(255,79,184,.85),inset 0 0 0 1px rgba(255,255,255,.4)}
.btn:hover::after,.btn:focus-visible::after{left:130%}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn svg{width:22px;height:22px;fill:currentColor}
@media (prefers-reduced-motion:reduce){
  .portrait,.portrait::before,h1{animation:none}
}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<main>
  <div class="portrait" id="portrait"><img src="avatar.png" alt="Azalina"></div>
  <h1>broodmother</h1>
  <a class="btn" href="https://t.me/azalinapriest">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.8 15.6l-.4 4.2c.6 0 .9-.3 1.2-.6l2.9-2.7 6 4.4c1.1.6 1.9.3 2.2-1l3.9-18.3c.4-1.600-.6-2.300-1.700-1.900L1.300 9.500c-1.600.6-1.600 1.500-.3 1.900l5.900 1.800L20.600 4.600c.6-.4 1.200-.2.700.2z"/></svg>
    Telegram-канал
  </a>
</main>
<script>
(function(){
  var c=document.getElementById('fx'),x=c.getContext('2d'),W,H,bolts=[];
  var still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function size(){var d=devicePixelRatio||1;W=c.width=innerWidth*d;H=c.height=innerHeight*d;x.setTransform(d,0,0,d,0,0);W/=d;H/=d}
  size();addEventListener('resize',size);

  function bolt(){
    var side=Math.random(),sx,sy;
    if(side<.5){sx=Math.random()*W;sy=-10}else{sx=Math.random()<.5?-10:W+10;sy=Math.random()*H*.7}
    var tx=W/2+(Math.random()-.5)*W*.25,ty=H*.45+(Math.random()-.5)*H*.2;
    var pts=[[sx,sy]],n=14,px=sx,py=sy;
    for(var i=1;i<=n;i++){
      var t=i/n;
      px=sx+(tx-sx)*t+(Math.random()-.5)*70*(1-t*.4);
      py=sy+(ty-sy)*t+(Math.random()-.5)*70*(1-t*.4);
      pts.push([px,py]);
    }
    var branches=[];
    for(var k=0;k<3;k++){
      var s=pts[2+Math.floor(Math.random()*8)],b=[s.slice()],bx=s[0],by=s[1];
      for(var j=0;j<5;j++){bx+=(Math.random()-.5)*80;by+=Math.random()*60;b.push([bx,by])}
      branches.push(b);
    }
    bolts.push({pts:pts,branches:branches,life:1,pink:Math.random()<.5});
  }
  function path(p){x.beginPath();x.moveTo(p[0][0],p[0][1]);for(var i=1;i<p.length;i++)x.lineTo(p[i][0],p[i][1]);x.stroke()}
  var next=0;
  function frame(t){
    x.clearRect(0,0,W,H);
    if(t>next){bolt();if(Math.random()<.3)bolt();next=t+1400+Math.random()*2600}
    x.lineJoin='round';x.lineCap='round';
    for(var i=bolts.length-1;i>=0;i--){
      var b=bolts[i];b.life-=.035;
      if(b.life<=0){bolts.splice(i,1);continue}
      var a=Math.min(1,b.life*1.6),col=b.pink?'255,79,184':'180,100,255';
      x.shadowColor='rgba('+col+',1)';x.shadowBlur=22;
      x.strokeStyle='rgba('+col+','+a*.8+')';x.lineWidth=4;path(b.pts);
      x.strokeStyle='rgba(255,240,255,'+a+')';x.lineWidth=1.5;path(b.pts);
      x.lineWidth=1;b.branches.forEach(path);
    }
    requestAnimationFrame(frame);
  }
  if(!still)requestAnimationFrame(frame);

  var p=document.getElementById('portrait');
  if(!still&&matchMedia('(hover:hover)').matches){
    addEventListener('mousemove',function(e){
      var rx=(e.clientY/innerHeight-.5)*-10,ry=(e.clientX/innerWidth-.5)*10;
      p.style.transform='perspective(800px) rotateX('+rx+'deg) rotateY('+ry+'deg)';
    });
  }
})();
</script>
</body>
</html>
